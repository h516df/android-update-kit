name: Release recovery checks
on:
  push:
    branches: [main]
    paths: ['scripts/**', 'tools/install_kit.py', 'tests/**', 'README.md', 'CHANGELOG.md', '.github/workflows/release-tools.yml']
  pull_request:
    paths: ['scripts/**', 'tools/install_kit.py', 'tests/**', 'README.md', 'CHANGELOG.md', '.github/workflows/release-tools.yml']
permissions:
  contents: read
jobs:
  release-recovery:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Isolated release and install regressions
        run: python3 -m unittest discover -s tests -v
