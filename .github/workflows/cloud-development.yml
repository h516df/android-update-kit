name: Cloud development
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloud-development-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Prepare cloud toolchain
        run: bash .devcontainer/setup.sh
      - name: Check this revision
        run: bash cloud/check.sh
      - name: Updater JVM compatibility
        shell: bash
        run: |
          json_jar="$RUNNER_TEMP/notes-json-20250517.jar"
          check_jar="$RUNNER_TEMP/notes-check.jar"
          curl --fail --location --silent --show-error --connect-timeout 10 --max-time 90 \
            https://repo.maven.apache.org/maven2/org/json/json/20250517/json-20250517.jar -o "$json_jar"
          echo "3ea61b2a06e31edf1c91134fe9106b0ebb16628be169f3db75bc7a2b06b45796  $json_jar" | sha256sum --check --status
          kotlinc kit/src/main/java/dev/h516/update/UpdateConfig.kt \
            kit/src/main/java/dev/h516/update/ReleaseNotes.kt kit/src/main/java/dev/h516/update/UpdateCatalog.kt \
            tests/ReleaseNotesCheck.kt tests/UpdateCatalogCheck.kt \
            -cp "$json_jar" -include-runtime -d "$check_jar"
          java -cp "$check_jar:$json_jar" dev.h516.update.ReleaseNotesCheckKt
          java -cp "$check_jar:$json_jar" dev.h516.update.UpdateCatalogCheckKt
          access_jar="$RUNNER_TEMP/access-check.jar"
          android_jar="$ANDROID_HOME/platforms/android-36/android.jar"
          kotlinc kit/src/main/java/dev/h516/update/UpdateConfig.kt \
            kit/src/main/java/dev/h516/update/UpdateAuth.kt kit/src/main/java/dev/h516/update/UpdateHttp.kt \
            kit/src/main/java/dev/h516/update/UpdateRun.kt tests/UpdateAccessCheck.kt tests/UpdateRunCheck.kt \
            tests/UpdateDownloadCheck.kt -cp "$json_jar:$android_jar" -include-runtime -d "$access_jar"
          java -cp "$access_jar:$json_jar" dev.h516.update.UpdateAccessCheckKt
          java -cp "$access_jar:$json_jar" dev.h516.update.UpdateRunCheckKt
          java -cp "$access_jar:$json_jar" dev.h516.update.UpdateDownloadCheckKt
